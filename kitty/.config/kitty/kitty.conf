include 	color.ini
# term xterm-256color

enable_audio_bell   no
font_family         JetBrains Mono Medium Nerd Font Complete Mono
bold_font           JetBrains Mono Bold Nerd Font Complete Mono
italic_font         JetBrains Mono Medium Italic Nerd Font Complete Mono
bold_italic_font    JetBrains Mono Bold Italic Nerd Font Complete Mono

font_size 	        11

disable_ligatures never

# url_color           #fff
url_style           curly

cursor_shape 	      beam
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
tab_bar_style  	    slant

allow_remote_control yes

shell zsh

copy_on_select yes
map ctrl+c copy_and_clear_or_interrupt
map cmd+v        paste_from_clipboard
map shift+insert paste_from_clipboard

map ctrl+shift+plus change_font_size all +1.0
map cmd+plus change_font_size all +1.0 🍎

map ctrl+shift+minus change_font_size all -1.0
map cmd+minus change_font_size all -1.0 🍎

map ctrl+shift+backspace change_font_size all 0
map cmd+0 change_font_size all 0 🍎
