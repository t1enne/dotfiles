onboarding = false
# herdr configuration — mirrored from ~/.dotfiles/tmux/.tmux.conf
#
# This mirrors the keybindings from the tmux config so switching
# between tmux and herdr is painless. Mapping legend (tmux -> herdr):
#   prefix C-Space  -> prefix ctrl+space
#   v (split -h)    -> split_vertical   (side-by-side / to the right)
#   h (split -v)    -> split_horizontal (top/bottom / down)
#   n (rename)      -> rename_tab
#   w (new window)  -> new_tab
#   M-j / M-k       -> previous_tab / next_tab
#   Alt-h/j/k/l     -> focus_pane_*  (direct pane navigation)
#   prefix C-arrows -> resize_mode

[theme]
# habamax (nvim colorscheme) - catppuccin-derived base with tokens
# overridden to habamax.vim hex values for a faithful match.
name = "one-dark"
auto_switch = false

[theme.custom]
# surfaces / neutrals (habamax.vim dark palette)
panel_bg      = "#1C1C1C"   # Normal bg
surface_dim   = "#262626"   # Folded bg
surface0      = "#303030"   # CursorLine bg
surface1      = "#3A3A3A"   # Pmenu / ColorColumn bg

# text
text         = "#BCBCBC"    # Normal fg
subtext0     = "#767676"    # Comment
overlay0     = "#585858"    # LineNr / NonText
overlay1     = "#9E9E9E"    # Statusline gray

# semantic accents (mapped one-to-one to habamax hues)
accent   = "#FFAF5F"    # IncSearch / Cursor / CursorLineNr peach
mauve    = "#AF87AF"    # Statement
peach    = "#D7875F"    # Constant / orange
green    = "#87AF87"    # String / Added
yellow   = "#AFAF87"    # PreProc / Question / olive
red      = "#D75F5F"    # Error / Removed
blue     = "#5F87AF"    # Type / blue
teal 		 = "#0D1111"
# teal     = "#87AFAF"    # Identifier / Directory

[keys]
# Prefix key (tmux: set -g prefix C-Space)
prefix = "ctrl+space"

# Splits — mirror tmux exactly:
#   v -> split-window -h (side-by-side, "right")
#   h -> split-window -v (top/bottom, "down")
split_vertical = "prefix+v"
split_horizontal = "prefix+h"

# Windows (herdr: tabs)
rename_tab = "prefix+r"
new_tab = "prefix+w"
previous_tab = "alt+h"
next_tab = "alt+l"
next_workspace = "alt+j"
previous_workspace = "alt+k"

# Pane navigation — tmux used direct C-h/j/k/l (with nvim passthrough).
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# Closing panes, zoom, last pane — keep sensible defaults.
close_pane = "prefix+x"
zoom = "prefix+z"

# Resize — tmux: prefix C-Up/C-Down/C-Left/C-Right; herdr uses a resize mode.
resize_mode = "prefix+m"

# Tab switching
switch_tab = "prefix+1..9"
workspace_picker = "prefix+space"
goto = "prefix+g"
new_workspace = "prefix+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Sidebar / misc
detach = "prefix+q"
reload_config = "prefix+shift+r"
edit_scrollback = "prefix+e"
settings = "prefix+s"
toggle_sidebar = "prefix+b"

[ui]
tab_bar_position = "top"
# accent = "#98971a"
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
[ui.toast]
delivery = "system"
